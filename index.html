<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>SMRITI (स्मृति) — Daily Memory & Wellness Sanctuary</title>
  <meta name="description" content="SMRITI — AI-Powered Cognitive Care & Memory Sanctuary for Elderly. High-contrast, multilingual, accessible daily routine companion.">
  <meta name="theme-color" content="#800020">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="css/icon-192.svg">
  <link rel="apple-touch-icon" href="css/icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Google Fonts: Plus Jakarta Sans & Lexend for WCAG high legibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS & React 18 Integration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            maroon: { DEFAULT: '#800020', dark: '#5B0017', light: '#9B2C2C' },
            healing: { DEFAULT: '#0D9488', dark: '#0F766E', light: '#CCFBF1' },
            calm: { DEFAULT: '#0284C7', dark: '#0369A1', light: '#E0F2FE' },
            wellness: { DEFAULT: '#15803D', dark: '#166534', light: '#DCFCE7' },
            sanctuary: '#FDFBF7'
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script>
    // Global error catcher
    window.onerror = function(msg, src, line, col, err) {
      console.error('SMRITI Global Error:', msg, src, line, col, err);
      const root = document.getElementById('root');
      if (root && root.querySelector('.loading-state')) {
        root.innerHTML =
          '<div style="padding:24px;color:#800020;font-family:monospace;white-space:pre-wrap;background:#FFF5F5;border:2px solid #FEB2B2;border-radius:16px;margin:16px;">' +
          '<h3>Recovery Refresh:</h3>' + msg + '\n\nFile: ' + src +
          '<div style="margin-top:12px;"><button onclick="if(\'caches\' in window){caches.keys().then(k=>k.forEach(c=>caches.delete(c)));}location.reload(true);" style="padding:10px 18px;background:#800020;color:white;border-radius:10px;font-weight:700;cursor:pointer;">Clear Cache & Refresh</button></div>' +
          '</div>';
      }
    };
    window.addEventListener('unhandledrejection', function(e) {
      console.warn('SMRITI Unhandled Promise Rejection:', e.reason);
    });

    // Auto-rescue watchdog: if app doesn't mount in 3s due to stale ServiceWorker cache, purge and refresh
    setTimeout(() => {
      const root = document.getElementById('root');
      if (root && root.querySelector('.loading-state')) {
        console.warn('Watchdog triggered: clearing stale caches...');
        if ('caches' in window) {
          caches.keys().then(names => {
            names.forEach(name => {
              if (name !== 'smriti-v20') caches.delete(name);
            });
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(reg => reg.update());
          });
        }
      }
    }, 2500);
  </script>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#FDFBF7]" data-region="Assam" data-lang="en">
  <!-- Accessibility Skip Link -->
  <a href="#page-content" class="skip-link sr-only focus:not-sr-only">Skip to main content</a>

  <!-- Main Application Root Landmark -->
  <div id="root" class="app-root min-h-screen flex flex-col justify-between">
    <div class="loading-state" style="padding: 40px 20px; text-align: center; color: #800020; font-family: 'Plus Jakarta Sans', sans-serif;">
      <div style="font-size: 3rem; margin-bottom: 12px; animation: gentlePulse 2s infinite ease-in-out;">🧠</div>
      <p style="font-size: 1.25rem; font-weight: 700; margin: 0;">Loading SMRITI Sanctuary...</p>
      <p style="font-size: 0.95rem; color: #64748B; margin-top: 6px;">Daily Memory & Wellness Companion</p>
    </div>
  </div>

  <!-- Accessible Modals & Slide-over Drawers Container Mount Points -->
  <div id="modal-container" aria-live="polite"></div>

  <!-- App Entry Point (Cache Busted to guarantee instant updates) -->
  <script type="module" src="js/app.js?v=2026.09.18.1"></script>

  <!-- Service Worker Registration for Offline & Edge Resilience -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=2026.09.18.1')
          .then((reg) => {
            reg.update();
            console.log('SMRITI ServiceWorker registered with scope:', reg.scope);
          })
          .catch((err) => console.warn('SMRITI ServiceWorker registration warning:', err));
      });
    }
  </script>
</body>
</html>
