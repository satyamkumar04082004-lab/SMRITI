<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>SMRITI (स्मृति) — Daily Memory & Wellness Sanctuary</title>
  <meta name="description" content="SMRITI — AI-Powered Cognitive Care & Memory Sanctuary for Elderly. High-contrast, multilingual, accessible daily routine companion.">
  <meta name="theme-color" content="#800020">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="css/icon-192.svg">
  <link rel="apple-touch-icon" href="css/icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Google Fonts: Plus Jakarta Sans & Lexend for WCAG high legibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Design System Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/style.css">

  <script>
    // Global error catcher — shows JS errors on screen and dismisses loading state
    window.onerror = function(msg, src, line, col, err) {
      console.error('SMRITI Global Error:', msg, src, line, col, err);
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML =
          '<div style="max-width:560px;margin:40px auto;padding:24px;color:#800020;font-family:\'Plus Jakarta Sans\',sans-serif;background:#FFF5F5;border:2px solid #FEB2B2;border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,0.08);">' +
          '<div style="font-size:2.5rem;margin-bottom:8px;">⚠️</div>' +
          '<h3 style="margin:0 0 8px 0;color:#991B1B;font-size:1.3rem;">SMRITI Boot Diagnostic</h3>' +
          '<p style="color:#7F1D1D;font-size:0.95rem;margin:0 0 12px 0;">An error occurred while starting SMRITI:</p>' +
          '<div style="font-family:monospace;font-size:0.82rem;background:#FEE2E2;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-all;color:#7F1D1D;margin-bottom:16px;">' +
          msg + (src ? ('\nFile: ' + src + (line ? (':' + line + ':' + col) : '')) : '') + 
          (err && err.stack ? ('\n\nStack:\n' + err.stack) : '') + '</div>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
          '<button onclick="window.location.reload()" style="padding:10px 18px;background:#800020;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:700;">🔄 Refresh Page</button>' +
          '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.href=\'#/login\';window.location.reload();" style="padding:10px 18px;background:#fff;color:#800020;border:1.5px solid #800020;border-radius:10px;cursor:pointer;font-weight:700;">🧹 Clear Cache & Sign In</button>' +
          '</div></div>';
      }
    };
    window.addEventListener('unhandledrejection', function(e) {
      console.warn('SMRITI Unhandled Promise Rejection:', e.reason);
    });

    // Failsafe watchdog timer: If app hasn't cleared loading state after 3.5 seconds, offer recovery
    setTimeout(function() {
      const root = document.getElementById('root');
      const loader = root ? root.querySelector('.loading-state') : null;
      if (loader && !document.getElementById('page-content')) {
        console.warn('SMRITI Boot Watchdog: App taking longer than expected to initialize.');
        const hint = document.createElement('div');
        hint.style.cssText = 'margin-top: 20px; font-size: 0.9rem; color: #64748B;';
        hint.innerHTML = '<p>Initialization taking longer than usual?</p>' +
          '<button onclick="window.location.href=\'#/login\';window.location.reload();" style="padding:8px 16px;background:#9B2C2C;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;">Go to Direct Login ➔</button>';
        loader.appendChild(hint);
      }
    }, 3500);
  </script>
</head>
<body class="min-h-screen flex flex-col justify-between" data-region="Assam" data-lang="en">
  <!-- Accessibility Skip Link -->
  <a href="#page-content" class="skip-link sr-only focus:not-sr-only">Skip to main content</a>

  <!-- Main Application Root Landmark -->
  <div id="root" class="app-root min-h-screen flex flex-col justify-between">
    <div class="loading-state" style="padding: 40px 20px; text-align: center; color: #800020; font-family: 'Plus Jakarta Sans', sans-serif;">
      <div style="font-size: 3rem; margin-bottom: 12px; animation: gentlePulse 2s infinite ease-in-out;">🧠</div>
      <p style="font-size: 1.25rem; font-weight: 700; margin: 0;">Loading SMRITI Sanctuary...</p>
      <p style="font-size: 0.95rem; color: #64748B; margin-top: 6px;">Daily Memory & Wellness Companion</p>
    </div>
  </div>

  <!-- Accessible Modals & Slide-over Drawers Container Mount Points -->
  <div id="modal-container" aria-live="polite"></div>

  <!-- App Entry Point -->
  <script type="module" src="js/app.js"></script>

  <!-- Service Worker Registration for Offline & Edge Resilience -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('SMRITI ServiceWorker registered with scope:', reg.scope))
          .catch((err) => console.warn('SMRITI ServiceWorker registration warning:', err));
      });
    }
  </script>
</body>
</html>
